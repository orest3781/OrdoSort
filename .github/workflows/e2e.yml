name: E2E

# The end-to-end suite drives real windows against real files (RenderTargetBitmap
# for screenshots, WebView2 for the routing scenario), so it needs an actual
# desktop session and runs as its own job rather than folding into CI's fast
# build-test / smoke gate.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest   # a desktop session: RenderTargetBitmap and WebView2 both need one
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Run the end-to-end suite
        run: dotnet run --project tools/OrdoSort.Smoke -- e2e

      # if: always() — the report is most valuable on the runs that fail,
      # which is exactly when a normal upload step would be skipped
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: evidence/
