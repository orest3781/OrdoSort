name: E2E

# The end-to-end suite drives real windows against real files (RenderTargetBitmap
# for screenshots, WebView2 for the routing scenario), so it needs an actual
# desktop session and runs as its own job rather than folding into CI's fast
# build-test / smoke gate.

# Bare `push:` meant every push to every branch, and `pull_request:` then ran
# the whole 20-minute desktop suite a SECOND time for any branch that had a PR
# open. Gating push on main and tags keeps the release-critical runs and lets
# the PR trigger cover everything else exactly once.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "ordosort.com/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "ordosort.com/**"]
  workflow_dispatch:

# A second push to the same branch supersedes the first run — don't pay for
# both, least of all at 20 desktop-runner minutes each.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# The suite reads the checkout and uploads its evidence artifact; the token
# needs nothing beyond read (artifact upload uses its own scope-free API).
permissions:
  contents: read

jobs:
  e2e:
    runs-on: windows-latest   # a desktop session: RenderTargetBitmap and WebView2 both need one
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Run the end-to-end suite
        run: dotnet run --project tools/OrdoSort.Smoke -- e2e

      # if: always() — the report is most valuable on the runs that fail,
      # which is exactly when a normal upload step would be skipped
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: evidence/
